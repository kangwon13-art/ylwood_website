<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페이지를 찾을 수 없습니다 | INFILL</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/svg+xml" href="assets/logo/app-icon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">

    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

    <style>
        :root {
            --color-bg-primary: #F5F6F8;
            --color-accent-orange: #FF6B35;
            --color-accent-orange-hover: #E8551E;
            --color-text-white: #1A1F2B;
            --color-text-muted: #5F6875;
            --color-border: #DDE1E8;
            --font-family-base: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        a { color: inherit; text-decoration: none; }
        body {
            background: var(--color-bg-primary);
            font-family: var(--font-family-base);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .logo-area { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
        .logo-area svg { width: 32px; height: 32px; }
        .logo-wordmark { font-size: 20px; font-weight: 800; letter-spacing: 1.5px; color: var(--color-text-white); }
        .logo-endorsement { font-size: 12px; color: var(--color-text-muted); margin-left: 8px; }
        .error-code { font-size: 15px; font-weight: 700; color: var(--color-accent-orange); letter-spacing: 2px; margin-bottom: 12px; }
        h1 { font-size: 22px; font-weight: 800; color: var(--color-text-white); margin-bottom: 10px; word-break: keep-all; }
        p { font-size: 14px; color: var(--color-text-muted); line-height: 1.7; margin-bottom: 28px; word-break: keep-all; }
        .btn-home {
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--color-accent-orange); color: #FFFFFF;
            font-weight: 700; font-size: 15px; padding: 14px 28px;
            border-radius: 8px; text-decoration: none;
            transition: background 0.2s ease;
        }
        .btn-home:hover { background: var(--color-accent-orange-hover); }
    </style>
</head>

<body>
    <a href="/" class="logo-area">
        <svg viewBox="0 0 100 100" aria-hidden="true">
            <polygon points="90,52 70,86.64 30,86.64 10,52 30,17.36 70,17.36" fill="none" stroke="#1A1F2B" stroke-width="7" />
            <rect x="32" y="34" width="36" height="32" rx="3" fill="#FF6B35" />
            <line x1="36" y1="46" x2="64" y2="46" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
            <line x1="36" y1="56" x2="64" y2="56" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
        </svg>
        <span class="logo-wordmark">INFILL</span><span class="logo-endorsement">by 영림우드</span>
    </a>
    <div class="error-code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 페이지가 없거나 이동되었습니다.<br>홈으로 돌아가 원하시는 정보를 찾아보세요.</p>
    <a href="/" class="btn-home">홈으로 가기</a>
</body>

</html>
